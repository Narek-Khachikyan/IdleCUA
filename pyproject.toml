[project]
name = "idle-cua"
version = "0.1.0"
description = "IdleCUA - policy-gated idle-time computer-use agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
]

[project.scripts]
idle-cua = "idle_cua.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idle_cua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
