const TASK_PLANS = {
  'a1b2c3': { target:'arxiv.org', title:'ArXiv — computer-use agents', date:'Today 10:34', findings:3, urls:5, excerpt:'3 papers flagged: OSWorld, MiniWoB++, WebArena. Relevance scored against your profile interests. Top finding: “OSWorld — real-world OS benchmarks for CUA”.', duration:12, maxActions:28, verdicts:[{action:'open_allowed_site arxiv.org', verdict:'allowed'},{action:'search', verdict:'allowed'},{action:'read_ui', verdict:'allowed'},{action:'save_note', verdict:'allowed'}]},
  'queued1': { target:'arxiv.org', title:'Queued — arXiv recent', date:'Just now', findings:0, urls:0, excerpt:'Queued for next idle window · 12 min · up to 28 actions · arxiv.org', duration:12, maxActions:28, verdicts:[{action:'open_allowed_site arxiv.org', verdict:'allowed'},{action:'search', verdict:'allowed'}]},
  'running1': { target:'x.com', title:'Running — X idle agents', date:'Running', findings:1, urls:2, excerpt:'Running · 7/22 actions · 1 finding so far · live…', duration:7, maxActions:22, verdicts:[{action:'open_allowed_site x.com', verdict:'allowed'},{action:'search', verdict:'allowed'},{action:'save_note', verdict:'allowed'}]},

function mins(s){ const m=Math.floor(s/60); const sec=s%60; return m+'m '+sec+'s'; }
function toast(msg){ const t=document.createElement('div'); t.className='fixed top-10 right-4 z-[95] bg-zinc-900 text-white text-sm px-4 py-2.5 rounded-xl shadow-xl border border-white/10 max-w-[360px]'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function humanize(entry){
  const raw=entry.action||'';
  const parts=raw.split(' ');
  const kind=parts[0];
  const param=parts.slice(1).join(' ');
  const map={open_allowed_site: param? 'Open '+param : 'Open allowed site', search:'Search', read_ui:'Read page', save_note:'Save note', close_own_tab:'Close tab', open_app: param? 'Open '+param : 'Open app', like:'Like post', scroll:'Scroll'};
  return map[kind] || raw.replace(/_/g,' ');
}
function honest(){
  const s=MOCK.status, thr=MOCK.settings.limits.idleSec;
  if(s.demoMode) return {dot:'bg-amber-400', text:'Limited mode — stub planner · LLM off', sub:'Sessions run on stub planner · LLM disabled', cta:'Add key'};
  if(s.idleSeconds < thr) return {dot:'bg-amber-400', text:'Waiting for idle — '+mins(s.idleSeconds)+' / '+mins(thr), sub:'Starts when you stay idle'};
  return {dot:'bg-emerald-500', text:'Ready — idle threshold met', sub:'Agent will start at next idle window'};
}
function inspectorHtml(taskId){
  const plan=TASK_PLANS[taskId];
  if(!plan) return '<div class="text-sm text-zinc-500 p-4">Select a task</div>';
  let rows='';
  for(let i=0;i<plan.verdicts.length;i++){
    const v=plan.verdicts[i];
    const label=humanize(v);
    const isNeed=v.verdict==='needs-confirmation';
    const pill=isNeed ? '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full border text-xs font-medium bg-amber-50 border-amber-200 text-amber-800">⚠ needs confirmation</span>' : '<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full border text-xs font-medium bg-emerald-50 border-emerald-200 text-emerald-800">✓ allowed</span>';
    const btns=isNeed ? '<div class="flex gap-1.5 ml-2"><button onclick="toast(\'Approve '+taskId+'\')" class="px-2.5 py-1 rounded-full bg-zinc-900 text-white text-xs font-medium">Approve</button><button onclick="toast(\'Skip '+taskId+'\')" class="px-2.5 py-1 rounded-full border border-zinc-200 bg-white text-xs">Skip</button></div>' : '';
    rows+='<div class="flex justify-between items-center px-4 py-3"><span class="text-[15px] font-medium">'+label+'</span><div class="flex items-center">'+pill+btns+'</div></div>';
  }
  const allowed=plan.verdicts.filter(v=>v.verdict==='allowed').length;
  const needs=plan.verdicts.filter(v=>v.verdict==='needs-confirmation').length;
  const summary=needs>0 ? allowed+' allowed • '+needs+' needs confirmation' : allowed+' allowed';
  let report='';
  if(plan.findings>0){
    report='<div class="border border-zinc-200 rounded-2xl p-4"><div class="text-[15px] font-semibold">'+plan.title+'</div><div class="text-sm text-zinc-500 mt-0.5">'+plan.date+' • '+plan.findings+' findings • '+plan.urls+' urls</div><div class="text-[15px] text-zinc-700 mt-3 leading-relaxed">'+plan.excerpt+'</div><button onclick="toast(\'Open report '+taskId+'\')" class="mt-3 text-sm bg-zinc-900 text-white px-4 py-2 rounded-full font-medium">Open report</button></div>';
  } else if(plan.blocked){
    report='<div class="border border-red-200 bg-red-50 rounded-2xl p-4"><div class="text-[15px] font-semibold text-red-800">Blocked</div><div class="text-sm text-red-600 mt-1">Domain not in allowlist</div><div class="text-[15px] text-zinc-700 mt-3 leading-relaxed">'+plan.excerpt+'</div><button onclick="toast(\'Edit allowlist\')" class="mt-3 text-sm bg-white border border-red-200 px-4 py-2 rounded-full font-medium">Edit allowlist</button></div>';
  } else {
    report='<div class="border border-zinc-200 rounded-2xl p-4"><div class="text-[15px] font-semibold">'+plan.title+'</div><div class="text-sm text-zinc-500 mt-0.5">'+plan.date+'</div><div class="text-[15px] text-zinc-600 mt-3">'+plan.excerpt+'</div></div>';
  }
  const limits='<div class="border border-zinc-200 rounded-2xl p-4 text-sm"><div class="font-semibold text-[15px]">This plan — budget</div><div class="mt-3 space-y-2 text-[14px] text-zinc-600"><div class="flex justify-between"><span>Duration</span><span class="font-medium text-zinc-900">'+plan.duration+' min</span></div><div class="flex justify-between"><span>Actions</span><span class="font-medium text-zinc-900">up to '+plan.maxActions+'</span></div><div class="flex justify-between"><span>Checks</span><span class="font-medium text-zinc-900">'+summary+'</span></div><div class="text-xs text-zinc-500 mt-2 pt-2 border-t border-zinc-100">Session max: 200 actions · 45 min · 150 LLM/day (see header)</div></div></div>';
  return '<div class="border border-zinc-200 rounded-2xl overflow-hidden"><div class="px-4 py-3 bg-zinc-50 border-b border-zinc-200 text-sm font-semibold">Plan → '+plan.target+' • '+plan.duration+' min • up to '+plan.maxActions+' actions</div><div class="divide-y divide-zinc-100">'+rows+'</div></div>'+report+limits;
}
function gettingHtml(){
  const doneCount=MOCK.gettingStarted.filter(s=>s.done).length;
  const total=MOCK.gettingStarted.length;
  const blocker=MOCK.gettingStarted.find(s=>!s.done);
  const desc=blocker ? blocker.desc : '';
  return '<div class="bg-white border border-zinc-200 rounded-2xl px-5 py-3 flex items-center gap-3"><span class="w-2 h-2 rounded-full bg-amber-400"></span><span class="text-sm font-medium">Getting started — '+doneCount+'/'+total+'</span><span class="hidden sm:inline text-sm text-zinc-500">One step left — '+blocker.label+': '+desc+'</span><button onclick="toast(\'Add key\')" class="ml-auto bg-zinc-900 text-white px-4 py-1.5 rounded-full text-sm font-medium">Add key</button><button onclick="document.getElementById(\'gettingDetails\')?.classList.toggle(\'hidden\')" class="text-sm text-zinc-500 underline ml-2">Details</button></div><div id="gettingDetails" class="hidden mt-2 bg-white border border-zinc-200 rounded-2xl p-4"><div class="grid grid-cols-4 gap-3">'+MOCK.gettingStarted.map(s=>'<div class="border rounded-xl p-3 '+( !s.done && s.id==='provider' ? 'border-zinc-900 bg-zinc-900 text-white' : s.done ? 'border-zinc-200 bg-zinc-50' : 'border-amber-300 bg-amber-50')+'"><div class="text-[13px] font-medium">'+s.label+'</div><div class="text-xs mt-1 '+( !s.done && s.id==='provider' ? 'text-zinc-300' : 'text-zinc-500')+'">'+s.desc+'</div></div>').join('')+'</div></div>';
}
function tasksHtml(){
  let rows='';
  for(let i=0;i<MOCK.tasks.length;i++){
    const t=MOCK.tasks[i];
    const plan=TASK_PLANS[t.id];
    let res='—'; if(plan){ if(t.state==='queued') res='—'; else res=plan.findings+' findings · '+plan.urls+' urls'; }
    const sel=i===0;
    const cls=sel ? 'bg-blue-50 border-l-2 border-blue-500' : 'hover:bg-zinc-50 border-l-2 border-transparent';
    const col=t.state==='failed' ? 'text-red-600' : t.state==='running' ? 'text-blue-600' : t.state==='queued' ? 'text-amber-600' : 'text-emerald-700';
    const ic=t.state==='completed' ? '✓' : t.state==='failed' ? '⚠' : t.state==='running' ? '●' : t.state==='queued' ? '○' : '○';
    let extra=''; if(t.state==='failed') extra='<button onclick="event.stopPropagation(); toast(\'Retry '+t.id+'\')" class="ml-2 text-xs px-2 py-1 rounded-full bg-white border border-red-200 text-red-700">Retry</button>'; else if(t.state==='running') extra='<span class="ml-2 text-xs px-2 py-0.5 rounded-full bg-blue-100 text-blue-700">live</span>'; else if(t.state==='queued') extra='<span class="ml-2 text-xs px-2 py-0.5 rounded-full bg-amber-100 text-amber-700">queued</span>';
    rows+='<div onclick="selectTask(\''+t.id+'\')" data-task="'+t.id+'" class="task-row grid grid-cols-[1fr_110px_90px_80px] px-4 py-3.5 cursor-pointer '+cls+'"><span class="text-[15px] font-medium truncate pr-3 text-zinc-900 leading-snug">'+t.goal+'</span><span class="text-sm text-zinc-600 mono truncate">'+res+'</span><span class="inline-flex items-center gap-1.5 text-sm truncate '+col+'">'+ic+' '+t.state+'</span><span class="text-sm text-zinc-500">'+t.when+'</span></div>';
  }
  return rows;
}

let selectedTask='a1b2c3';
function selectTask(id){
  selectedTask=id;
  const rows=document.querySelectorAll('.task-row');
  for(let i=0;i<rows.length;i++){
    const el=rows[i];
    const isSel=el.getAttribute('data-task')===id;
    el.classList.toggle('bg-blue-50',isSel);
    el.classList.toggle('border-blue-500',isSel);
  }
  const insp=document.getElementById('inspector');
  if(insp) insp.innerHTML=inspectorHtml(id);
  const sub=document.getElementById('inspectorSub');
  const t=MOCK.tasks.find(x=>x.id===id);
  if(sub && t) sub.textContent=t.goal.slice(0,48);
}
function getVariant(){ const p=new URLSearchParams(location.search).get('variant'); return (p && VARIANTS[p] ? p : 'D'); }
function setVariant(k){ const url=new URL(location.href); url.searchParams.set('variant',k); history.replaceState(null,'',url); render(); }
function render(){
  const v=getVariant();
  let html='';
  if(v==='A') html=renderA();
  else if(v==='B') html=renderB();
  else if(v==='C') html=renderC();
  else html=renderD();
  document.getElementById('app').innerHTML=html;
  const meta=VARIANTS[v];
  document.getElementById('variantLabel').textContent=meta.key+' — '+meta.name;
  document.getElementById('variantDesc').textContent=meta.desc;
  if(v==='D' || v==='C'){
    setTimeout(()=>{ const insp=document.getElementById('inspector'); if(insp) insp.innerHTML=inspectorHtml(selectedTask); },0);
  }
}
document.getElementById('prevBtn').onclick=()=>{ const ks=Object.keys(VARIANTS); const cur=getVariant(); const i=ks.indexOf(cur); setVariant(ks[(i-1+ks.length)%ks.length]); };
document.getElementById('nextBtn').onclick=()=>{ const ks=Object.keys(VARIANTS); const cur=getVariant(); const i=ks.indexOf(cur); setVariant(ks[(i+1)%ks.length]); };
document.addEventListener('keydown',e=>{ if(e.target.matches('input,textarea,[contenteditable]')) return; if(e.key==='ArrowLeft') document.getElementById('prevBtn').click(); if(e.key==='ArrowRight') document.getElementById('nextBtn').click(); });
render();
window.selectTask=selectTask;
</script>
