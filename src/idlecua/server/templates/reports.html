<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Reports — IdleCUA</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="p-8">
<h1 class="text-2xl font-semibold">Reports</h1>
<p class="text-sm text-zinc-500">Markdown reports rendered in the UI</p>
<ul class="mt-4 space-y-2">
{% for r in reports %}
<li class="border p-3 rounded"><a href="/reports/{{ r.task_id }}" class="text-blue-600 underline">Report {{ r.task_id[:8] }}</a> — {{ r.created_at }}</li>
{% endfor %}
</ul>
{% if not reports %}<p class="text-sm text-zinc-500 mt-4">No reports yet</p>{% endif %}
<a href="/" class="underline text-blue-600 mt-6 inline-block">← Dashboard</a>
</body></html>
