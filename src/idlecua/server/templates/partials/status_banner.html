<div class="border rounded-2xl p-4 flex gap-3 items-start {{ 'bg-amber-50 border-amber-200' if honest.dot=='bg-amber-400' else 'bg-emerald-50 border-emerald-200' if honest.dot=='bg-emerald-500' else 'bg-blue-50 border-blue-200' }}">
  <span class="mt-1 w-2.5 h-2.5 rounded-full {{ honest.dot }} shrink-0"></span>
  <div class="flex-1 min-w-0">
    <div class="text-[15px] font-semibold {{ 'text-amber-900' if honest.dot=='bg-amber-400' else 'text-emerald-900' if honest.dot=='bg-emerald-500' else 'text-blue-900' }}">{{ honest.banner_text }}</div>
    <div class="text-sm {{ 'text-amber-800' if honest.dot=='bg-amber-400' else 'text-emerald-800' if honest.dot=='bg-emerald-500' else 'text-blue-800' }}">{{ honest.sub }}</div>
  </div>
  {% if demo_mode %}
    <span class="shrink-0 mono text-xs bg-amber-400 text-zinc-900 px-2.5 py-1 rounded-full font-semibold">Demo mode — stub planner</span>
  {% elif honest.cta %}
    <button onclick="location.href='/settings'" class="shrink-0 bg-zinc-900 text-white px-4 py-2 rounded-full text-sm font-medium">{{ honest.cta }}</button>
  {% endif %}
</div>
