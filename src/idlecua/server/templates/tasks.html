<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Tasks — IdleCUA</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="p-8">
<h1 class="text-2xl font-semibold">Tasks</h1>
<p class="text-sm text-zinc-500 mt-1">Filterable by state — queued, running, completed, failed, stopped</p>
<table class="mt-4 w-full border text-sm">
<thead class="bg-zinc-50"><tr><th class="p-2 border">Goal</th><th class="p-2 border">Result</th><th class="p-2 border">State</th><th class="p-2 border">When</th></tr></thead>
<tbody>
{% for t in tasks %}
<tr><td class="p-2 border">{{ t.description }}</td><td class="p-2 border">{{ t.state }}</td><td class="p-2 border">{{ t.state }}</td><td class="p-2 border">{{ t.created_at }}</td></tr>
{% endfor %}
</tbody>
</table>
<a href="/" class="text-blue-600 underline mt-4 inline-block">← Dashboard</a>
</body></html>
